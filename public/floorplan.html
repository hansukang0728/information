<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>힐스테이트 광교 평면도</title>
<style>
  :root { --bg:#ffffff; --fg:#111; --sub:#666; --accent:#0a8f6e; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg:#1b1b1b; --fg:#eee; --sub:#aaa; }
  }
  :root[data-theme="dark"] { --bg:#1b1b1b; --fg:#eee; --sub:#aaa; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif; }
  header { max-width:1200px; margin:0 auto; padding:16px 16px 0; }
  h1 { margin:0; font-size:22px; }
  .bar { height:6px; margin:8px 0 10px;
         background:linear-gradient(90deg,#0a8f6e 0 58%,#222 58% 74%,#e8962b 74%); }
  h2 { margin:0 0 6px; font-size:18px; }
  .controls { display:flex; gap:16px; flex-wrap:wrap; font-size:14px; color:var(--sub); }
  .controls label { cursor:pointer; }
  .wrap { max-width:1200px; margin:0 auto; padding:8px 16px 24px; }
  .paper { background:#fff; border-radius:8px; padding:8px; }
  svg { width:100%; height:auto; display:block; }
  .room { font-weight:700; fill:#333; text-anchor:middle; dominant-baseline:middle; }
  .dim text { fill:#111; font-weight:700; font-size:330px; text-anchor:middle; dominant-baseline:middle;
              paint-order:stroke; stroke:#fff; stroke-width:60px; stroke-opacity:.85; }
  .dim line { stroke:#e00; stroke-width:28; }
  .hide-dims .dim { display:none; }
  .hide-labels .room { display:none; }
  footer { font-size:12px; color:var(--sub); margin-top:8px; }
</style>
</head>
<body>
<header>
  <h1>힐스테이트 광교 (평면도)</h1>
  <div class="bar"></div>
  <h2>▶ 힐스테이트 광교 97A㎡ 확장형</h2>
  <div class="controls">
    <label><input type="checkbox" id="tDims" checked> 치수 표시</label>
    <label><input type="checkbox" id="tLabels" checked> 실 이름 표시</label>
  </div>
</header>
<div class="wrap">
  <div class="paper"><svg id="plan" xmlns="http://www.w3.org/2000/svg"></svg></div>
  <footer>단위: mm · 원본 평면도 이미지를 읽어 다시 그린 것으로, 치수 숫자는 원본 표기를 따르고 도면 비율은 근사치입니다.</footer>
</div>

<script>
const NS = 'http://www.w3.org/2000/svg';
const svg = document.getElementById('plan');
// 도면 좌표계: mm 단위, 원점 = 좌상단
svg.setAttribute('viewBox', '-900 -900 19100 12200');

function el(tag, attrs, parent = svg) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  parent.appendChild(e);
  return e;
}
function g(cls) { return el('g', cls ? { class: cls } : {}); }

/* ---------- 패턴/그라디언트 ---------- */
const defs = el('defs', {});
defs.innerHTML = `
  <radialGradient id="bed" cx="50%" cy="50%" r="70%">
    <stop offset="0" stop-color="#fbf3dc"/><stop offset="1" stop-color="#e8cd94"/>
  </radialGradient>
  <linearGradient id="woodBase" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#d98a3d"/><stop offset=".5" stop-color="#e09a52"/><stop offset="1" stop-color="#c97529"/>
  </linearGradient>
  <pattern id="woodGrain" width="300" height="1800" patternUnits="userSpaceOnUse">
    <rect width="300" height="1800" fill="none"/>
    <line x1="0" y1="0" x2="0" y2="1800" stroke="#b8651f" stroke-opacity=".35" stroke-width="10"/>
    <line x1="150" y1="900" x2="150" y2="1800" stroke="#b8651f" stroke-opacity=".25" stroke-width="8"/>
    <line x1="150" y1="0" x2="150" y2="600" stroke="#b8651f" stroke-opacity=".25" stroke-width="8"/>
  </pattern>
  <pattern id="checker" width="400" height="400" patternUnits="userSpaceOnUse">
    <rect width="400" height="400" fill="#f4f4f4"/>
    <rect width="200" height="200" fill="#dcdcdc"/><rect x="200" y="200" width="200" height="200" fill="#dcdcdc"/>
  </pattern>
  <pattern id="tile" width="300" height="300" patternUnits="userSpaceOnUse">
    <rect width="300" height="300" fill="#f1ede6"/>
    <path d="M300 0V300H0" fill="none" stroke="#d6d0c4" stroke-width="12"/>
  </pattern>
  <marker id="arr" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0 0L10 5L0 10z" fill="#e00"/>
  </marker>`;

/* ---------- 바닥(실) ---------- */
const floors = g();
const C = { bed:'url(#bed)', bath:'#d8e8f2', gray:'#d6d6d6', white:'#fafafa', tile:'url(#tile)', checker:'url(#checker)' };
function room(x, y, w, h, fill, stroke = true) {
  el('rect', { x, y, width:w, height:h, fill }, floors);
  if (stroke) el('rect', { x, y, width:w, height:h, fill:'none', stroke:'#111', 'stroke-width':150 }, walls);
}
function wood(points) {
  el('polygon', { points, fill:'url(#woodBase)' }, floors);
  el('polygon', { points, fill:'url(#woodGrain)' }, floors);
}
const walls = document.createElementNS(NS, 'g'); // 나중에 svg에 붙임 (바닥 위)

// 거실·주방·복도 (원목 마루) — 하나의 연속된 바닥
wood('1835,4600 7460,4600 7460,2880 8000,2880 8000,700 11050,700 11050,4560 11880,4560 11880,10050 7000,10050 7000,5900 1835,5900');

// 현관 및 수납
room(630, 900, 1205, 5000, C.checker, false);       // 현관 타일
room(100, 900, 530, 2850, C.white);                 // 신발장
room(100, 4400, 530, 1500, C.white);                // 수납
// 좌측 실
room(1900, 900, 1810, 1100, C.gray);                // 창고
room(1900, 2000, 1810, 2560, C.bath);               // 욕실1
room(3780, 900, 2690, 3660, C.bed);                 // 침실1
room(6470, 2880, 990, 1680, C.gray);                // 수납(1775)
// 하부 실
room(100, 5960, 2940, 3620, C.bed);                 // 침실3
room(3100, 5960, 610, 1690, C.white);               // 붙박이장 상
room(3100, 7750, 610, 1830, C.white);               // 붙박이장 하
room(3780, 5960, 3080, 3620, C.bed);                // 침실4
// 주방 상부
room(7300, 0, 4580, 700, C.white);                  // 상부 조리대
room(7300, 700, 700, 1280, C.white);                // 좌측 조리대
room(11050, 1950, 830, 2610, C.white);              // 냉장고장(2820/840)
// 우측 실
room(11880, 0, 1720, 1950, C.gray);                 // 다용도실
room(11880, 2010, 2480, 2550, C.bath);              // 욕실2
room(14360, 950, 1210, 3610, C.bed);                // 드레스룸
room(15570, 1880, 1280, 2680, C.white);             // 붙박이장
room(11880, 4630, 4970, 3770, C.bed);               // 안방(침실2)
room(11880, 8450, 2410, 1300, C.tile);              // 발코니
room(14290, 8450, 1680, 1300, C.gray);              // 실외기실
// 덕트
room(5800, 100, 1200, 700, C.white);
room(6250, 9580, 610, 420, C.white);

// 거실·주방 외곽 내벽 (실 경계 보강)
[[7000,5900,7000,10050],[7460,2880,7460,4600],[1835,4600,6470,4600],[1835,5900,7000,5900],
 [11880,4560,11880,10050],[8000,700,8000,2880],[11050,700,11050,1950]].forEach(([x1,y1,x2,y2]) =>
  el('line', { x1, y1, x2, y2, stroke:'#111', 'stroke-width':150 }, walls));

// 외벽
el('polygon', {
  points:'0,800 5800,800 5800,0 13900,0 13900,950 15600,950 15600,1880 16900,1880 16900,8400 15970,8400 15970,9750 11880,9750 11880,10050 7000,10050 7000,9650 0,9650',
  fill:'none', stroke:'#111', 'stroke-width':260, 'stroke-linejoin':'miter'
}, walls);
svg.appendChild(walls);

/* ---------- 개구부: 창문 / 문 ---------- */
const openings = g();
function win(x1, y1, x2, y2) {           // 외벽 위 창호
  const horiz = y1 === y2;
  const t = 260;
  const r = horiz ? { x:Math.min(x1,x2), y:y1 - t/2, width:Math.abs(x2-x1), height:t }
                  : { x:x1 - t/2, y:Math.min(y1,y2), width:t, height:Math.abs(y2-y1) };
  el('rect', { ...r, fill:'#e9eef2', stroke:'#888', 'stroke-width':20 }, openings);
  el('line', { x1, y1, x2, y2, stroke:'#888', 'stroke-width':20 }, openings);
}
win(830, 800, 1630, 800); win(2380, 800, 3240, 800); win(4330, 800, 5720, 800);
win(8800, 0, 10480, 0); win(12150, 0, 13600, 0); win(14500, 950, 15300, 950);
win(16900, 2600, 16900, 3800); win(16900, 5600, 16900, 7240);
win(1030, 9650, 2570, 9650); win(4180, 9650, 6060, 9650); win(7760, 10050, 11060, 10050);
win(12300, 9750, 13970, 9750); win(14500, 9750, 15600, 9750);
win(12300, 8420, 13970, 8420);

// 문: (힌지 x,y), 반지름, 문짝 방향 각도, 열리는 방향 각도
function door(hx, hy, r, a0, a1) {
  const rad = d => d * Math.PI / 180;
  const p0 = [hx + r*Math.cos(rad(a0)), hy + r*Math.sin(rad(a0))];
  const p1 = [hx + r*Math.cos(rad(a1)), hy + r*Math.sin(rad(a1))];
  // 문틀 자리 벽 지우기
  const sweep = ((a1 - a0 + 360) % 360) < 180 ? 1 : 0;
  el('line', { x1:hx, y1:hy, x2:p0[0], y2:p0[1], stroke:'#fff', 'stroke-width':170 }, openings);
  el('path', { d:`M${p0[0]} ${p0[1]} A${r} ${r} 0 0 ${sweep} ${p1[0]} ${p1[1]}`,
               fill:'none', stroke:'#555', 'stroke-width':25 }, openings);
  el('line', { x1:hx, y1:hy, x2:p1[0], y2:p1[1], stroke:'#555', 'stroke-width':35 }, openings);
}
door(0, 4400, 750, 270, 180);         // 현관문 (외부로)
door(2000, 2000, 650, 0, 270);        // 창고
door(3600, 4560, 800, 180, 270);      // 욕실1
door(4200, 4560, 800, 0, 270);        // 침실1
door(3000, 5960, 700, 180, 90);       // 침실3
door(6750, 5960, 800, 180, 90);       // 침실4
door(11880, 600, 800, 90, 0);         // 다용도실
door(11880, 4630, 750, 90, 0);        // 안방
door(14250, 2700, 600, 90, 180);      // 욕실2
door(15970, 8450, 800, 180, 90);      // 실외기실

/* ---------- 설비 ---------- */
const fx = g();
const S = { fill:'#fff', stroke:'#555', 'stroke-width':25 };
function xbox(x, y, w, h) {
  el('rect', { x, y, width:w, height:h, ...S }, fx);
  el('path', { d:`M${x} ${y}L${x+w} ${y+h}M${x+w} ${y}L${x} ${y+h}`, stroke:'#555', 'stroke-width':25 }, fx);
}
function toilet(cx, cy, rot = 0) {
  const t = el('g', { transform:`translate(${cx} ${cy}) rotate(${rot})` }, fx);
  el('rect', { x:-250, y:-380, width:500, height:200, rx:40, ...S }, t);
  el('ellipse', { cx:0, cy:60, rx:220, ry:280, ...S }, t);
}
function sink(cx, cy, rot = 0) {
  const t = el('g', { transform:`translate(${cx} ${cy}) rotate(${rot})` }, fx);
  el('rect', { x:-330, y:-250, width:660, height:500, rx:60, ...S }, t);
  el('ellipse', { cx:0, cy:30, rx:220, ry:160, ...S }, t);
}
// 욕실1
xbox(2000, 2100, 650, 900);
sink(3350, 2350, 0);
toilet(2300, 3800, 270);
el('rect', { x:2750, y:3300, width:850, height:1150, fill:'#eef5f9', stroke:'#777', 'stroke-width':20 }, fx); // 샤워부스
// 욕실2
xbox(11980, 2100, 750, 800);
xbox(13600, 2100, 650, 800);
el('rect', { x:11980, y:3000, width:720, height:1450, rx:250, ...S }, fx);           // 욕조
el('rect', { x:12060, y:3080, width:560, height:1290, rx:220, fill:'#eef5f9', stroke:'#777', 'stroke-width':20 }, fx);
toilet(13000, 2700, 0);
sink(13450, 3900, 0);
// 주방
el('rect', { x:9000, y:120, width:550, height:420, rx:60, ...S }, fx);             // 개수대
el('circle', { cx:9275, cy:330, r:120, ...S }, fx);
el('path', { d:'M8400 180H8850M8400 280H8850M8400 380H8850M8400 480H8850', stroke:'#777', 'stroke-width':20 }, fx); // 식기건조대
[[7650,1100],[7650,1500]].forEach(([cx,cy]) => {                                     // 쿡탑
  el('circle', { cx, cy, r:170, ...S }, fx);
  el('path', { d:`M${cx-90} ${cy-90}L${cx+90} ${cy+90}M${cx+90} ${cy-90}L${cx-90} ${cy+90}`, stroke:'#555', 'stroke-width':20 }, fx);
});
el('rect', { x:7300, y:900, width:700, height:850, fill:'none', stroke:'#555', 'stroke-width':25, rx:80 }, fx);
// 냉장고장·수납
el('rect', { x:6700, y:3050, width:550, height:1350, ...S }, fx);
el('rect', { x:15800, y:2150, width:850, height:1500, ...S }, fx);

// 아일랜드 식탁 (2740 × 900) + 스툴
el('rect', { x:7460, y:1980, width:2740, height:900, fill:'#f4f1ec', stroke:'#111', 'stroke-width':60, rx:40 }, fx);
el('rect', { x:7560, y:2080, width:2540, height:700, fill:'none', stroke:'#bbb', 'stroke-width':20, rx:30 }, fx);
el('text', { x:8830, y:2440, class:'room', 'font-size':240, 'font-weight':600 }, fx).textContent = '아일랜드 식탁';
[8300, 9100, 9900].forEach(cx => el('circle', { cx, cy:3600, r:200, fill:'#fff', stroke:'#555', 'stroke-width':30 }, fx));

/* ---------- 실 이름 ---------- */
const labels = g();
function label(x, y, txt, size = 420) {
  txt.split('\n').forEach((line, i, arr) =>
    el('text', { x, y: y + (i - (arr.length-1)/2) * size * 1.15, class:'room', 'font-size':size }, labels).textContent = line);
}
label(5125, 2650, '침실');
label(9500, 1250, '주방\n식당');
label(14965, 2300, '드레스\n룸', 300);
label(14365, 6450, '침실');
label(1570, 7700, '침실');
label(5320, 7650, '침실');
label(9440, 7600, '거실');
label(13085, 9100, '발코니', 380);

/* ---------- 치수선 ---------- */
const dims = g('dim');
function dim(x1, y1, x2, y2, txt) {
  el('line', { x1, y1, x2, y2, 'marker-start':'url(#arr)', 'marker-end':'url(#arr)' }, dims);
  const mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
  const vertical = x1 === x2;
  const t = el('text', vertical
    ? { x:mx, y:my, transform:`rotate(90 ${mx} ${my})` }
    : { x:mx, y:my - 200 }, dims);
  t.textContent = txt;
}
// 침실1
dim(3780, 600, 6470, 600, '2690');
dim(3780, 1150, 4330, 1150, '450');
dim(5720, 1150, 6470, 1150, '750');
dim(6330, 965, 6330, 2780, '1675');
dim(3930, 965, 3930, 4425, '3460');
dim(4330, 4400, 6470, 4400, '1800');
dim(6620, 2880, 6620, 4560, '1775');
// 주방
dim(7460, 3200, 10200, 3200, '2740');
dim(7620, 2880, 7620, 4560, '1900');
dim(11200, 1950, 11200, 4300, '2820');
dim(11050, 4380, 11880, 4380, '840');
// 안방
dim(11880, 4950, 14360, 4950, '2510');
dim(14360, 4950, 15420, 4950, '1060');
dim(15570, 4950, 16850, 4950, '1065');
dim(16650, 4630, 16650, 5600, '915');
dim(17450, 4630, 17450, 8400, '3565');
dim(12050, 5600, 12050, 8400, '2510');
dim(16650, 7240, 16650, 8400, '850');
dim(11880, 8200, 12300, 8200, '410');
dim(13970, 8200, 16850, 8200, '2470');
dim(11880, 8780, 16850, 8780, '4685');
// 현관·복도
dim(100, 6250, 1835, 6250, '1810');
dim(1990, 5960, 1990, 6400, '400');
dim(1950, 4650, 1950, 5850, '');
// 침실3
dim(2900, 5960, 2900, 7230, '1690');
dim(2900, 7950, 2900, 9580, '1613');
dim(260, 6400, 260, 9580, '2895');
dim(100, 9420, 1000, 9420, '860');
dim(100, 10100, 3040, 10100, '2970');
// 침실4
dim(3780, 6150, 6300, 6150, '2100');
dim(3940, 5960, 3940, 7850, '1613');
dim(3940, 7950, 3940, 9580, '1660');
dim(3780, 9420, 4050, 9420, '190');
dim(6100, 9420, 6860, 9420, '720');
dim(6700, 6150, 6700, 9450, '3285');
dim(3780, 10100, 6860, 10100, '3005');
// 거실
dim(7150, 6150, 7150, 10000, '3849');
dim(11700, 6000, 11700, 10000, '4000');
dim(7000, 9850, 7760, 9850, '760');
dim(11060, 9850, 11880, 9850, '740');
dim(7000, 10600, 11880, 10600, '4800');

/* ---------- 토글 ---------- */
const root = document.querySelector('.paper');
document.getElementById('tDims').onchange = e => root.classList.toggle('hide-dims', !e.target.checked);
document.getElementById('tLabels').onchange = e => root.classList.toggle('hide-labels', !e.target.checked);
</script>
</body>
</html>
