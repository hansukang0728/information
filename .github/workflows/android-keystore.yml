# 1단계 (한 번만): 앱 서명 키(keystore)를 만들어 줍니다.
# Actions 탭 → "1. 서명 키 만들기" → Run workflow.
# 끝나면 실행 결과의 Summary 에 나오는 안내대로 Secrets 에 등록하세요.
name: "1. 서명 키 만들기"

on:
  workflow_dispatch:

jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 서명 키 생성
        run: |
          PASS=$(openssl rand -hex 16)
          keytool -genkeypair -v \
            -keystore release.keystore -alias nearby \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PASS" -keypass "$PASS" \
            -dname "CN=Nearby, OU=App, O=Nearby, L=Seoul, C=KR"

          # 카카오 개발자 콘솔에 등록할 키 해시
          HASH=$(keytool -exportcert -alias nearby -keystore release.keystore -storepass "$PASS" \
            | openssl sha1 -binary | openssl base64)

          mkdir -p out
          base64 -w0 release.keystore > out/KEYSTORE_BASE64.txt
          echo "$PASS" > out/KEYSTORE_PASSWORD.txt
          echo "$HASH" > out/KAKAO_KEY_HASH.txt

          {
            echo "## 서명 키가 만들어졌습니다"
            echo
            echo "1. 이 화면 아래 **Artifacts** 에서 \`signing-key\` 를 내려받아 압축을 푸세요."
            echo "2. 저장소 **Settings → Secrets and variables → Actions → New repository secret** 에서 다음을 등록하세요."
            echo
            echo "| Secret 이름 | 값 |"
            echo "|---|---|"
            echo "| \`KEYSTORE_BASE64\` | KEYSTORE_BASE64.txt 파일의 내용 전체 |"
            echo "| \`KEYSTORE_PASSWORD\` | KEYSTORE_PASSWORD.txt 파일의 내용 |"
            echo "| \`KAKAO_NATIVE_APP_KEY\` | 카카오 콘솔의 네이티브 앱 키 |"
            echo "| \`KAKAO_REST_API_KEY\` | 카카오 콘솔의 REST API 키 |"
            echo
            echo "3. 카카오 개발자 콘솔 → **플랫폼 → Android** 에 등록하세요."
            echo
            echo "- 패키지명: \`kr.nearby.app\`"
            echo "- 키 해시: \`$HASH\`"
            echo
            echo "4. \`release.keystore\` 파일은 잃어버리면 같은 키로 다시 서명할 수 없으니 안전한 곳에 보관하세요."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: signing-key
          path: |
            out/
            release.keystore
          retention-days: 7
