# 낱말카드 안드로이드 앱(APK) 자동 빌드
# - wordcards/ 가 바뀌어 푸시되면 테스트용 APK를 만들어 Actions 실행 결과의 Artifacts 에 올립니다.
# - wordcards/package.json 의 version 으로 "wordcards-v1.0.0" 릴리스를 만들어 APK를 올립니다.
#   (이미 있는 버전이면 건너뜁니다. 새 릴리스를 내려면 version 을 올리세요.)
# - 플레이 스토어용 서명 키를 Secrets 에 넣어 두면 서명된 AAB 도 함께 만듭니다 (wordcards/README.md 참고).
name: 낱말카드 안드로이드 빌드

on:
  push:
    branches: ['**']
    tags: ['wordcards-v*']
    paths: ['wordcards/**', '.github/workflows/wordcards-android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
    defaults:
      run:
        working-directory: wordcards
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: wordcards/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: 패키지 설치 및 웹 파일 복사
        run: |
          npm ci
          npx cap sync android

      - name: 테스트용 APK 빌드
        working-directory: wordcards/android
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew assembleDebug --no-daemon

      - name: 서명된 플레이 스토어용 AAB 빌드 (Secrets 가 있을 때만)
        if: env.HAS_KEYSTORE == 'true'
        working-directory: wordcards/android
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          KEYSTORE_PATH="$RUNNER_TEMP/release.jks" ./gradlew bundleRelease assembleRelease --no-daemon

      - name: 파일 이름 정리
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/wordcards-debug.apk
          cp android/app/build/outputs/bundle/release/*.aab out/wordcards-release.aab 2>/dev/null || true
          cp android/app/build/outputs/apk/release/*-release.apk out/wordcards-release.apk 2>/dev/null || true
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: wordcards-android
          path: wordcards/out/*

      - name: 릴리스 이름 정하기
        id: rel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/wordcards-v* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
          else
            tag="wordcards-v$(node -p "require('./package.json').version")"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "$tag 릴리스가 이미 있어 건너뜁니다."
          fi

      - name: Releases 에 올리기
        if: steps.rel.outputs.exists != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: 아기 낱말카드 ${{ steps.rel.outputs.tag }}
          body: |
            18개월 이상 아이를 위한 낱말카드 안드로이드 앱입니다.
            휴대폰에서 **wordcards-debug.apk** 를 받아 설치하세요. ("출처를 알 수 없는 앱 설치" 허용 필요)
          files: wordcards/out/*
