# 낱말카드 사진 가져오기 (수동 실행)
# - mode=candidates: 낱말마다 후보 사진을 찾아 미리보기 모음을 Artifacts 에 올립니다.
# - mode=fetch: photos/selection.json 에 고른 사진을 받아 www/photos/ 에 넣고 브랜치에 커밋합니다.
name: 낱말카드 사진 가져오기

on:
  workflow_dispatch:
    inputs:
      mode:
        description: candidates(후보 찾기) 또는 fetch(고른 사진 받기)
        required: true
        default: candidates
        type: choice
        options: [candidates, fetch]

permissions:
  contents: write

jobs:
  photos:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wordcards
    steps:
      - uses: actions/checkout@v4
      - run: pip install pillow
      - run: python3 tools/fetch_photos.py ${{ inputs.mode }}

      - if: inputs.mode == 'candidates'
        uses: actions/upload-artifact@v4
        with:
          name: photo-candidates
          path: wordcards/photos/candidates/

      - if: inputs.mode == 'fetch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add www/photos
          git commit -m "낱말카드: 위키미디어 공용 사진 추가" || echo "변경 없음"
          git push
